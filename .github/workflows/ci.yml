name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/guss_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/guss_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/guss_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres guss_e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
